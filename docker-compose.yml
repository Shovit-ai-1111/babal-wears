name: babal-wears

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babal}
      POSTGRES_USER: ${POSTGRES_USER:-babal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Zero-setup demo only; db has no published port. Production enforces SCRAM.
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-babal}
      POSTGRES_USER: ${POSTGRES_USER:-babal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-1}
      SEED_DEMO: ${SEED_DEMO:-1}
      TRUST_PROXY: "1"
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private-media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - public_media:/app/media
      - private_media:/app/private-media
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8000}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public_media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  public_media:
  private_media:
