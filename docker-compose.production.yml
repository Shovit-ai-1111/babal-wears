# Use a separate Compose project from the trust-authenticated demo database.
# docker compose -p babal-production -f docker-compose.yml -f docker-compose.production.yml up --build -d
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
  web:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set production hosts including 127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set the HTTPS origin}
      DEMO_MODE: "0"
      SEED_DEMO: "0"
      DJANGO_DEBUG: "0"
      COOKIE_SECURE: "1"
      SECURE_SSL_REDIRECT: "1"
      SECURE_HSTS_SECONDS: "3600"
  nginx:
    volumes:
      - ./deploy/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8080/health/ || exit 1"]
